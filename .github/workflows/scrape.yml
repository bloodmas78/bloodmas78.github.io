name: Scrape Billizone Data

on:
  schedule:
    # KST 08:00 = UTC 23:00 (previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape member data
        run: npm run scrape

      - name: Commit and push if changed (use PAT if provided)
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          PAT_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data.ts
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore: update member stats from Billizone scrape"
            if [ -n "$PAT_TOKEN" ]; then
              git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
            fi
            git push origin HEAD:refs/heads/${TARGET_BRANCH}
          fi

  deploy:
    needs: scrape
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
