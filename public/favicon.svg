<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="ballClip">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
    <radialGradient id="shadow" cx="35%" cy="35%" r="65%">
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
    </radialGradient>
  </defs>

  <!-- Background / White Base -->
  <circle cx="50" cy="50" r="48" fill="#f8f9fa" />
  
  <!-- Yellow Stripe -->
  <rect x="0" y="22" width="100" height="56" fill="#facc15" clip-path="url(#ballClip)" />
  
  <!-- Center White Circle -->
  <circle cx="50" cy="50" r="22" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" />
  
  <!-- Number 9 -->
  <text x="50" y="61" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="#1f2937" text-anchor="middle">9</text>
  
  <!-- Underline for 9 -->
  <path d="M 42 66 L 58 66" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" />

  <!-- Inner Shadow / 3D effect -->
  <circle cx="50" cy="50" r="48" fill="url(#shadow)" />
  
  <!-- Highlight -->
  <ellipse cx="32" cy="25" rx="14" ry="8" fill="#ffffff" opacity="0.7" transform="rotate(-30 32 25)" />
</svg>