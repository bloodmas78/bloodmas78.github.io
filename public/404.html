<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      fetch('/index.html')
        .then((response) => response.text())
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          document.body.innerText = '페이지를 불러오는 중 오류가 발생했습니다.';
        });
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
