<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ancient Sigil - Team Management</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-animations">
    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-fire {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 69, 0, 0.6)) brightness(1); }
      50% { filter: drop-shadow(0 0 35px rgba(255, 140, 0, 0.9)) brightness(1.3); }
    }
    @keyframes pulse-ice {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 191, 255, 0.4)); opacity: 0.8; }
      50% { filter: drop-shadow(0 0 25px rgba(0, 191, 255, 0.7)); opacity: 1; }
    }
    @keyframes sigil-activation {
      0% { transform: scale(1); filter: brightness(1) white; }
      50% { transform: scale(1.15); filter: brightness(3) contrast(1.5); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .animate-rotate-slow { animation: rotate-slow 20s linear infinite; }
    .animate-pulse-fire { animation: pulse-fire 3s infinite ease-in-out; }
    .animate-pulse-ice { animation: pulse-ice 4s infinite ease-in-out; }
    
    .sigil-active {
      animation: sigil-activation 0.6s ease-out forwards;
    }

    .rune-text {
      font-family: serif;
      text-shadow: 0 0 10px rgba(255, 165, 0, 0.8);
    }
    
    /* Stone texture simulation */
    .stone-texture {
      background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
      position: relative;
      clip-path: polygon(10% 0, 90% 0, 100% 20%, 100% 80%, 85% 100%, 15% 100%, 0 85%, 0 15%);
    }
    .stone-crack {
      position: absolute;
      background: rgba(0, 191, 255, 0.6);
      filter: blur(2px);
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black overflow-hidden font-sans antialiased text-white">
<main class="relative h-screen w-full flex items-center justify-center overflow-hidden" data-purpose="main-hero-container">
<!-- Background Image: Maintaining the specific image ID requested -->
<div class="absolute inset-0 z-0">
<img alt="Ancient Warrior Background" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB73Np4pAYP3FTcJhfWo6hrSCMVmRmnOBgJ82bP243KEA0MRpWHGBX-zJbLCxkXBqBLRWb115iHW0ZKRJfMSuyJyJoNtJyTjxAz8pOJkY2BOJ5T7hOby3SvVI9q_ymLNwQrUuSOJx0iyTaF6p-pvqLEnNSixjeh221-ytIWPaG7ZGXtGE8qIaCeguzk8d7LX4rAffg5YZFSSiFu2-1NlcyO_s2-d8Wg5meePFADdIM2x094-lRkhsNkUn9kwVZm8NgmZTA"/>
<!-- Atmospheric overlays -->
<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-black/60"></div>
<div class="absolute inset-0 bg-orange-900/10 mix-blend-color-burn"></div>
</div>
<!-- BEGIN: Sigil Interface -->
<div class="relative z-10 flex flex-col md:flex-row items-center justify-center gap-20 md:gap-40 px-4" data-purpose="action-buttons">
<!-- Team Placement Start: Magic Sigil -->
<div class="flex flex-col items-center gap-8 group">
<div class="relative flex items-center justify-center w-48 h-48 md:w-64 md:h-64 cursor-pointer" id="btn-placement-start">
<!-- Outer Rotating Rings -->
<svg class="absolute inset-0 w-full h-full animate-rotate-slow opacity-60" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="48" stroke="url(#fireGradient)" stroke-dasharray="1, 4" stroke-width="0.5"></circle>
<circle cx="50" cy="50" fill="none" r="42" stroke="url(#fireGradient)" stroke-dasharray="10, 5" stroke-width="1"></circle>
<defs>
<lineargradient id="fireGradient" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#ff4500;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1"></stop>
</lineargradient>
</defs>
</svg>
<!-- The Core Sigil Button -->
<button aria-label="Team Placement Start" class="relative z-10 w-32 h-32 md:w-44 md:h-44 rounded-full flex items-center justify-center transition-transform hover:scale-110 active:scale-95 animate-pulse-fire overflow-visible bg-transparent">
<!-- Geometric Patterns -->
<svg class="absolute inset-0 w-full h-full drop-shadow-[0_0_20px_rgba(255,69,0,0.8)]" viewbox="0 0 100 100">
<polygon fill="rgba(255, 69, 0, 0.1)" points="50,5 95,25 95,75 50,95 5,75 5,25" stroke="#ff4500" stroke-width="2"></polygon>
<polygon fill="none" points="50,15 80,30 80,70 50,85 20,70 20,30" stroke="#ff8c00" stroke-width="1.5"></polygon>
<!-- Inner Rune Circle -->
<path class="animate-rotate-slow" d="M50 20 A30 30 0 1 1 49.9 20" fill="none" stroke="#ffd700" stroke-dasharray="2 2" stroke-width="1" style="animation-direction: reverse;"></path>
</svg>
<!-- Central Icon (Rocket transformed to Sigil core) -->
<svg class="w-16 h-16 md:w-20 md:h-20 text-orange-100 relative z-20" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"></path>
<circle cx="12" cy="12" fill="rgba(255,255,255,0.4)" r="3"></circle>
</svg>
</button>
</div>
<span class="text-3xl md:text-4xl font-black text-orange-500 drop-shadow-[0_0_15px_rgba(255,69,0,1)] tracking-[0.2em] italic uppercase">
        팀 배치 시작
      </span>
</div>
<!-- Team Reset: Ancient Tablet Fragment -->
<div class="flex flex-col items-center gap-8 group">
<button aria-label="Team Reset" class="relative w-36 h-36 md:w-52 md:h-52 flex items-center justify-center transition-all hover:scale-110 active:scale-95 group" id="btn-team-reset">
<!-- Silver/Blue Runic Stone Base -->
<div class="absolute inset-0 rounded-full border-2 border-cyan-400/30 bg-gradient-to-t from-gray-800 to-gray-600 shadow-[0_0_20px_rgba(0,191,255,0.3)] overflow-hidden">
<div class="absolute inset-0 opacity-40 mix-blend-overlay bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]"></div>
<!-- Glowing Runic Cracks -->
<div class="absolute inset-0 animate-pulse-ice">
<svg class="w-full h-full opacity-50" viewbox="0 0 100 100">
<path d="M20 50 L40 50 M60 50 L80 50 M50 20 L50 40 M50 60 L50 80" fill="none" stroke="#00bfff" stroke-width="0.5"></path>
<circle cx="50" cy="50" fill="none" r="45" stroke="#00bfff" stroke-dasharray="2 2" stroke-width="0.2"></circle>
</svg>
</div>
</div>
<!-- Intricate Magical Reset Icon -->
<div class="relative z-10 flex items-center justify-center">
<svg class="w-16 h-16 md:w-24 md:h-24 text-cyan-100 drop-shadow-[0_0_15px_rgba(0,191,255,0.8)]" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
<circle class="animate-pulse" cx="12" cy="12" fill="currentColor" r="2"></circle>
</svg>
</div>
</button>
<span class="text-3xl md:text-4xl font-black text-cyan-400 drop-shadow-[0_0_15px_rgba(0,191,255,0.8)] tracking-[0.2em] italic uppercase">
        팀 초기화
      </span>
</div>
</div>
<!-- END: Sigil Interface -->
<!-- Navigation: Floating Ethereal Links -->
<nav class="absolute bottom-12 left-0 w-full flex justify-center items-center gap-12 text-lg font-bold tracking-[0.3em] text-gray-400" data-purpose="bottom-navigation">
<a class="hover:text-orange-400 transition-all duration-500 hover:tracking-[0.5em] relative py-2 px-4 group" href="#">
      팀 매칭
      <span class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-orange-500 to-transparent scale-x-125 opacity-100"></span>
</a>
<a class="hover:text-cyan-400 transition-all duration-500 hover:tracking-[0.5em] relative py-2 px-4" href="#">
      전적 보기
    </a>
</nav>
</main>
<script data-purpose="interaction-handlers">
    const startBtn = document.getElementById('btn-placement-start');
    const resetBtn = document.getElementById('btn-team-reset');

    startBtn.addEventListener('click', () => {
      // Visual feedback for sigil completion
      const buttonElem = startBtn.querySelector('button');
      buttonElem.classList.add('sigil-active');
      
      console.log('Ancient magic flows... Starting team placement.');
      
      setTimeout(() => {
        buttonElem.classList.remove('sigil-active');
      }, 600);
    });

    resetBtn.addEventListener('click', () => {
      console.log('The stone tablet resonates. Resetting selection...');
      // Subtle flash effect on reset
      resetBtn.style.filter = 'brightness(2) saturate(2)';
      setTimeout(() => {
        resetBtn.style.filter = '';
      }, 300);
    });
</script>
</body></html>
